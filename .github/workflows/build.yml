name: build

# Windows 每次推送都跑；macOS 分钟数计费是 Windows 的 10 倍，只在发版（推送 v* 标签）或手动触发时跑
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && fromJSON('["windows-latest","macos-latest"]') || fromJSON('["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # GitHub 的 Windows 机器没有显卡，只有 OpenGL 1.1；用 Mesa 的软件渲染跑冒烟测试
      - name: Software OpenGL (Windows)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3

      - name: Smoke test
        shell: bash
        run: |
          bin=build/bin
          [ -d build/bin/Release ] && bin=build/bin/Release
          python tests/make_test_frame.py frame.i420 640 480
          "$bin/lumina-cli" "$bin/models" 640 480 frame.i420 out.i420 smooth=1 whiten=1 filter=3 filter_intensity=1 --repeat 3
          python tests/check_changed.py frame.i420 out.i420
